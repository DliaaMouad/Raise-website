<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password | Raise Tools</title>
<meta name="description" content="Set a new password for your Raise Tools account.">
<link rel="stylesheet" href="tools.css">
</head>
<body>
<main>
  <div class="gate">
    <h2>Reset your password</h2>
    <p class="gate-sub">Set a new password for your Raise Tools account.</p>
    <p id="reset-error" class="auth-error" hidden></p>
    <p id="reset-success" class="auth-success" hidden></p>

    <div id="new-password-block" hidden>
      <form id="new-password-form" class="auth-form" novalidate>
        <label for="np-password">New password *</label>
        <input id="np-password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="np-confirm">Confirm new password *</label>
        <input id="np-confirm" type="password" autocomplete="new-password" required>
        <p><button class="btn btn-lime auth-submit" type="submit">Set new password</button></p>
      </form>
    </div>

    <div id="request-block" hidden>
      <form id="request-form" class="auth-form" novalidate>
        <label for="rq-email">Email *</label>
        <input id="rq-email" type="email" autocomplete="email" required>
        <p><button class="btn btn-lime auth-submit" type="submit">Send reset link</button></p>
      </form>
    </div>

    <p id="done-links" class="auth-switch" hidden>
      <a class="link-btn" href="/tools/crm">Go to Fundraising CRM</a>
      &nbsp;·&nbsp;
      <a class="link-btn" href="/tools">All tools</a>
    </p>
    <p class="auth-switch"><a class="link-btn" href="/tools">Back to tools</a></p>
  </div>
</main>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="reset.js"></script>
</body>
</html>
